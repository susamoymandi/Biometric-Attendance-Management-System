<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="card">

  <!-- SIGN UP -->
  <section id="v-signup" hidden>
    <h1>Create student account</h1>
    <p class="sub">All fields are required.</p>
    <div class="note" id="n-signup" role="status"></div>
    <form id="f-signup" novalidate>
      <div class="grid">
        <div class="field full" data-f="sid">
          <label for="s-id">Student ID</label>
          <input id="s-id" placeholder="BCA2026001" autocomplete="username" autocapitalize="characters" maxlength="14">
          <p class="msg"></p>
        </div>
        <div class="field full" data-f="name">
          <label for="s-name">Full name</label>
          <input id="s-name" placeholder="Susamoy Mandi" autocomplete="name">
          <p class="msg"></p>
        </div>
        <div class="field" data-f="dept">
          <label for="s-dept">Department</label>
          <select id="s-dept">
            <option value="">Select department</option>
            <option>BCA</option><option>BBA</option><option>B.Com</option><option>B.Sc</option><option>BA</option>
          </select>
          <p class="msg"></p>
        </div>
        <div class="field" data-f="sem">
          <label for="s-sem">Semester</label>
          <select id="s-sem">
            <option value="">Select semester</option>
            <option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option><option>6th</option>
          </select>
          <p class="msg"></p>
        </div>
        <div class="field full" data-f="email">
          <label for="s-email">Email</label>
          <input id="s-email" type="email" placeholder="student@email.com" autocomplete="email">
          <p class="msg"></p>
        </div>
        <div class="field" data-f="pw">
          <label for="s-pw">Password</label>
          <div class="pw">
            <input id="s-pw" type="password" placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" data-show="s-pw" aria-label="Show password">Show</button>
          </div>
          <p class="msg"></p>
        </div>
        <div class="field" data-f="pw2">
          <label for="s-pw2">Confirm password</label>
          <div class="pw">
            <input id="s-pw2" type="password" placeholder="Re-enter password" autocomplete="new-password">
            <button type="button" data-show="s-pw2" aria-label="Show confirm password">Show</button>
          </div>
          <p class="msg"></p>
        </div>
      </div>
      <button class="submit" type="submit">Create account</button>
    </form>
    <p class="foot">Already have an account? <a href="#login">Login</a></p>
  </section>

  <!-- LOGIN -->
  <section id="v-login" hidden>
    <h1>Student login</h1>
    <p class="sub">Log in with your Student ID and password.</p>
    <div class="note" id="n-login" role="status"></div>
    <form id="f-login" novalidate>
      <div class="grid">
        <div class="field full" data-f="sid">
          <label for="l-id">Student ID</label>
          <input id="l-id" placeholder="BCA2026001" autocomplete="username" autocapitalize="characters" maxlength="14">
          <p class="msg"></p>
        </div>
        <div class="field full" data-f="pw">
          <label for="l-pw">Password</label>
          <div class="pw">
            <input id="l-pw" type="password" placeholder="Your password" autocomplete="current-password">
            <button type="button" data-show="l-pw" aria-label="Show password">Show</button>
          </div>
          <p class="msg"></p>
        </div>
      </div>
      <button class="submit" type="submit">Log in</button>
    </form>
    <p class="foot">Don’t have an account? <a href="#signup">Sign up</a></p>
  </section>

  <!-- AFTER LOGIN -->
  <section id="v-welcome" class="welcome" hidden>
    <h1 id="w-title">Welcome</h1>
    <p class="sub">You are logged in.</p>
    <button class="submit" id="logout" type="button">Log out</button>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
